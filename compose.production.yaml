services:
  backend:
    environment:
      DEBUG: 'false'
      TRUST_PROXY: 'true'
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --access-logfile -
    ports: !reset []
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.production
    environment: !reset {}
    ports: !override ['8080:8080']
