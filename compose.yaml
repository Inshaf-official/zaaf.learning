services:
  db:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_DB: institution
      POSTGRES_USER: institution
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U institution]
      interval: 3s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    command: sh -c 'python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --access-logfile -'
    ports: ['8000:8000']
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://backend:8000
    ports: ['5173:5173']
    depends_on: [backend]
  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    volumes: ['redis_data:/data']
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 20
  worker:
    build: ./backend
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    command: celery -A config worker --loglevel=INFO --concurrency=2
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
  beat:
    build: ./backend
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
    command: celery -A config beat --loglevel=INFO --schedule=/tmp/celerybeat-schedule
    depends_on:
      redis:
        condition: service_healthy
volumes:
  redis_data:
  postgres_data:
