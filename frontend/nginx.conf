server {
 listen 8080;
 server_tokens off;
 root /usr/share/nginx/html;
 index index.html;
 client_max_body_size 2m;
 add_header X-Content-Type-Options nosniff always;
 add_header X-Frame-Options DENY always;
 add_header Referrer-Policy same-origin always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self'; connect-src 'self'; worker-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
 gzip on;
 gzip_types text/css application/javascript application/json image/svg+xml;
 location /api/ {
  proxy_pass http://backend:8000;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_read_timeout 120s;
  add_header Cache-Control no-store always;
 }
 location = /sw.js {add_header Cache-Control no-cache;}
 location = /index.html {add_header Cache-Control no-cache;}
 location /assets/ {expires 1y;add_header Cache-Control "public, immutable";}
 location / {try_files $uri $uri/ /index.html;}
}
